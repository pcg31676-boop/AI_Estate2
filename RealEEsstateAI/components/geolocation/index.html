<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body { margin: 0; color: #172033; }
      .shell {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 8px 0;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        color: white;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        box-shadow: 0 8px 18px rgba(37, 99, 235, .2);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
      }
      button:disabled { cursor: wait; opacity: .72; }
      #status { color: #475467; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <button id="detect" type="button">Detect My Location</button>
      <span id="status" aria-live="polite">Your browser will ask for location permission.</span>
    </div>
    <script>
      const button = document.getElementById("detect");
      const status = document.getElementById("status");

      function publish(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value,
          dataType: "json"
        }, "*");
      }

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: document.body.scrollHeight
      }, "*");

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          const error = {
            status: "error",
            message: "This browser does not support geolocation."
          };
          status.textContent = error.message;
          publish(error);
          return;
        }

        button.disabled = true;
        status.textContent = "Requesting your current location…";
        navigator.geolocation.getCurrentPosition(
          position => {
            const success = {
              status: "success",
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
              request_id: Date.now()
            };
            status.textContent =
              `Location detected (±${Math.round(position.coords.accuracy)} m).`;
            publish(success);
            button.disabled = false;
          },
          error => {
            const reasons = {
              1: "Location permission was denied.",
              2: "Your location is currently unavailable.",
              3: "Location request timed out."
            };
            const failure = {
              status: "error",
              message: reasons[error.code] || "Could not detect your location."
            };
            status.textContent = `${failure.message} Use the selected area below instead.`;
            publish(failure);
            button.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
        );
      });
    </script>
  </body>
</html>
