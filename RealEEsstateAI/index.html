<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Estate | Property Valuation & Intelligence Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07111F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-banner {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94A3B8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
      z-index: 100;
      pointer-events: none;
    }
    .fallback-card {
      display: none;
      max-width: 540px;
      margin: 100px auto;
      padding: 36px;
      background: #0F172A;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      color: #FFFFFF;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFFFFF;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>
  <div class="loading-banner">⚡ AI Estate Live Portal</div>
  <iframe id="app-frame" src="https://cute-oranges-camp.loca.lt" allow="camera; geolocation" allowfullscreen></iframe>
  <div class="fallback-card" id="fallback">
    <div style="font-size: 3rem; margin-bottom: 12px;">🏠</div>
    <h2>AI Estate Valuation Platform</h2>
    <p style="margin-top: 12px; color: #94A3B8; line-height: 1.5;">
      Launch the real-time AI valuation engine and photo analysis studio:
    </p>
    <a class="btn" href="https://cute-oranges-camp.loca.lt" target="_blank">Launch Application</a>
  </div>
</body>
</html>
